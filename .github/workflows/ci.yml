name: CI

on:
  push:
    branches: [main, staging, production]
  pull_request:
    branches: [main, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres 17 (same major as production) for the integration project
    # (tests/integration/**). Its globalSetup creates the schema with
    # drizzle-kit push; the DB guard only accepts local *_test databases.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sbt_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Same major as production (nixpacks.toml nodejs_20).
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          SESSION_SECRET: ci-test-secret
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sbt_ci_test
